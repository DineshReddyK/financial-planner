# Render Blueprint: https://render.com/docs/blueprint-spec
# After pushing this file, use Dashboard → New → Blueprint → select this repo.

# Service name becomes https://<name>.onrender.com (globally unique).
# If Render adds a random suffix (e.g. financial-planner-abc1), pick a more unique name
