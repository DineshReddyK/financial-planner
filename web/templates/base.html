<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title | default("Financial Planner") }} · India</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"] },
          colors: {
            accent: { DEFAULT: "#34d399", dim: "#059669" },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="min-h-full antialiased font-sans bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950/40">
  <header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-center px-4 py-3">
      <a href="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-white hover:text-emerald-300 transition">
        <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-500/20 text-emerald-400 ring-1 ring-emerald-500/30">₹</span>
        Financial Planner
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-6xl px-4 pb-10 text-center text-xs text-slate-500">
    Not financial advice. Numbers are illustrative — confirm taxes and products with a qualified professional.
  </footer>
</body>
</html>
