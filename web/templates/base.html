<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title | default("Financial Planner") }} · India</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .nav-link {
      padding: 0.375rem 0.75rem;
      border-radius: 0.5rem;
      color: rgb(148 163 184);
      font-size: 0.875rem;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .nav-link:hover { color: white; background-color: rgb(30 41 59); }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }
    .result-card {
      border-radius: 0.75rem;
      border: 1px solid rgb(30 41 59);
      background-color: rgba(15 23 42 / 0.6);
      padding: 1rem;
    }
    .result-label {
      font-size: 0.75rem;
      line-height: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgb(100 116 139);
    }
    .result-value {
      margin-top: 0.25rem;
      font-size: 1.25rem;
      line-height: 1.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body class="min-h-full antialiased font-sans" style="background: radial-gradient(ellipse at top, #0d2818 0%, #0f172a 50%, #020617 100%);">

  <header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 gap-4">
      <a href="/" class="flex shrink-0 items-center gap-2 text-base font-bold tracking-tight text-white hover:text-emerald-300 transition">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500/20 text-emerald-400 ring-1 ring-emerald-500/30 text-sm font-bold">₹</span>
        <span class="hidden sm:inline">Financial Planner</span>
      </a>
      <nav class="hidden md:flex items-center gap-0.5 text-sm overflow-x-auto">
        <a href="/planner" class="nav-link whitespace-nowrap font-medium" style="color:#34d399">Full plan</a>
        <a href="/investment" class="nav-link whitespace-nowrap">Investment</a>
        <a href="/mortgage" class="nav-link whitespace-nowrap">Mortgage</a>
        <a href="/sip-goal" class="nav-link whitespace-nowrap">SIP Goal</a>
        <a href="/" class="nav-link ml-1 border border-slate-700 hover:border-emerald-500/50 whitespace-nowrap">All tools →</a>
      </nav>
      <a href="/" class="md:hidden flex items-center gap-1.5 text-xs font-medium text-slate-400 hover:text-emerald-400 transition border border-slate-700 rounded-lg px-2.5 py-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        All tools
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-6xl px-4 pb-10 text-center text-xs text-slate-500">
    Not financial advice · Numbers are illustrative · Confirm taxes and products with a qualified professional.
  </footer>
</body>
</html>
